name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    strategy:
      matrix:
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  cli-windows:
    # Compile-only until the Windows port lands (docs/windows-app-plan.md, Phase 1); then run the
    # tests here too and fold this job into the `cli` matrix.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-run

  macos-app:
    # The app targets macOS 26, so it needs the macOS 26 SDK.
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v5
      - run: swift build
      - run: swift test
