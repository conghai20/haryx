# Keeps the Supabase Free project behind HaryX sync from being paused for inactivity
# (docs/haryx-account-plan.md, "Backend"). One read-only call a day to public.ping(), with the
# publishable key, which is public by design. GitHub disables scheduled workflows after 60 days
# without repository activity; an active repository is unaffected.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call ping()
        env:
          SUPABASE_URL: https://ygvcznwlugaxqqmlsssh.supabase.co
          SUPABASE_KEY: sb_publishable_xQxLmUkWlSFVVC4ifAy6hA_KiPOefNN
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" \
            -H "content-type: application/json" \
            -d '{}'
