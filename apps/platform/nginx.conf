# HaryX web inside its container (Dockerfile). The host's nginx proxies /platform/ here
# (deploy/nginx/haryx.wecoap.com.conf) and adds HSTS; the page's own policy is set here.
# The browser holds the sync key on this page, so it may load nothing but its own files and
# talk to nothing but this origin and WeCoAp SSO.
map $uri $platform_cache {
    ~^/platform/assets/  "public, max-age=31536000, immutable";
    default              "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; worker-src 'self'; connect-src 'self' https://sso.wecoap.com; frame-src 'self' https://sso.wecoap.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://sso.wecoap.com; object-src 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $platform_cache always;

    location = /platform {
        return 301 /platform/;
    }
    location /platform/assets/ {
        try_files $uri =404;
    }
    location /platform/ {
        try_files $uri $uri/ /platform/index.html;
    }
    # The silent check-sso hand-back (src/lib/auth.svelte.ts) runs in a hidden iframe of the page
    # above, so it alone may be framed, by this origin only. A location that sets its own headers
    # drops the server-level ones, so the rest are repeated.
    location = /platform/silent-check-sso.html {
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        return 404;
    }
}
