[workspace]
resolver = "3"
members = ["crates/haryx-core", "crates/haryx"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "HaryX: a unified control center for AI coding accounts, usage and sessions"
repository = "https://github.com/conghai20/haryx"
keywords = ["claude", "claude-code", "accounts", "cli", "quota"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
haryx-core = { path = "crates/haryx-core", version = "0.3.0" }
thiserror = "2"
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
jiff = { version = "0.2", features = ["serde"] }
fs4 = "0.13"
libc = "0.2"
junction = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
log = { version = "0.4", features = ["std"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json"] }
rand = "0.9"
sha2 = "0.10"
hmac = "0.12"
unicode-normalization = "0.1"
base64 = "0.22"
tempfile = "3"
dirs = "6"
ratatui = "0.29"
crossterm = "0.29"
tiny_http = "0.12"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The sync keyring is wrapped with scrypt at log_n 18 (sync/crypto.rs). Unoptimised, every unlock in
# a debug test run costs seconds; these crates are built optimised in dev/test builds only.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
