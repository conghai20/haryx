[package]
name = "haryx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
description.workspace = true

[[bin]]
name = "haryx"
path = "src/main.rs"

# The windowless build for the Windows wake task. Built only with `--features windowless` (the
# Windows release), so macOS and Linux installs do not carry it.
[[bin]]
name = "haryxw"
path = "src/bin/haryxw.rs"
required-features = ["windowless"]

[features]
windowless = []

[dependencies]
haryx-core.workspace = true
clap = { workspace = true, features = ["string"] }
serde_json.workspace = true
log.workspace = true
jiff.workspace = true
ratatui.workspace = true
crossterm.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
tiny_http.workspace = true

[lints]
workspace = true
