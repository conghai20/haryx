# HaryX API + its Postgres + nightly backups, for aaPanel (Docker → Compose).
#
# Keycloak is not here: it is WeCoAp SSO, deployed from wecoap-sso/deploy/. This stack only
# verifies its tokens. See deploy/README.md for the first deploy, the DNS switch and the restore
# drill.
#
# Project dir on the server (aaPanel default: /www/dk_project/haryx/) holds this file, backup/,
# and .env (made by gen-secrets.sh, never committed). The API is published on loopback only;
# aaPanel's site for haryx.wecoap.com (nginx/haryx.wecoap.com.conf) is the only way in.

name: haryx

x-db-env: &db-env
  PGHOST: haryx-postgres
  PGPORT: "5432"
  PGDATABASE: haryx
  PGUSER: haryx
  PGPASSWORD: ${HARYX_DB_PASSWORD:?run gen-secrets.sh}

services:
  postgres:
    image: postgres:18-alpine
    # Fixed name: aaPanel can attach containers to a network without compose's service alias.
    container_name: haryx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: haryx
      POSTGRES_USER: haryx
      POSTGRES_PASSWORD: ${HARYX_DB_PASSWORD:?run gen-secrets.sh}
    volumes:
      # 18+ keeps data in /var/lib/postgresql/18/docker; mount the parent, not .../data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haryx -d haryx"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ../server/api
    # Docker Hub, linux/amd64, tagged api-v<HaryX version>; unset = api-vlatest. Built and pushed
    # from the Mac:
    #   docker buildx build --platform linux/amd64 -t wecoap/haryx:api-v<version> \
    #     -t wecoap/haryx:api-vlatest --push server/api
    # On the server: `docker compose pull api && docker compose up -d --no-build`.
    image: wecoap/haryx:api-v${HARYX_API_VERSION:-latest}
    container_name: haryx-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *db-env
      HARYX_SSO_ISSUER: ${HARYX_SSO_ISSUER:-https://sso.wecoap.com/realms/wecoap}
    ports:
      - "127.0.0.1:18180:8080"

  backup:
    image: postgres:18-alpine
    container_name: haryx-backup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      <<: *db-env
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      # Offsite copy (in Vietnam) is aaPanel's scheduled rsync of this folder: README → Backups.
      - ${HARYX_BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
