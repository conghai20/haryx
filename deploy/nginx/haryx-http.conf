# http-level declarations for haryx.wecoap.com. aaPanel includes every *.conf in
# /www/server/panel/vhost/nginx/ inside `http {}`, so this file goes there next to the site file.

# Per-client-IP limit on the API. No Cloudflare in front any more, so this is the abuse limit.
limit_req_zone $binary_remote_addr zone=haryx_api:10m rate=10r/s;
limit_req_status 429;

# The marketing site comes from GitHub Pages; a local cache keeps it up when Pages is slow and
# replaces the CDN cache Cloudflare used to give.
proxy_cache_path /www/server/nginx/proxy_cache_dir/haryx levels=1:2 keys_zone=haryx_pages:10m
                 max_size=200m inactive=1h use_temp_path=off;
