# aaPanel site haryx.wecoap.com: /www/server/panel/vhost/nginx/haryx.wecoap.com.conf
# Needs haryx-http.conf (same folder) and haryx-headers.inc (/www/server/panel/vhost/nginx/haryx/).
#
#   /api/       → haryx-api on loopback (deploy/compose.yaml), rate-limited
#   /platform/  → the web platform, static files from release-platform.sh, SPA fallback
#   /           → the marketing site on GitHub Pages, cached

server {
    listen 80;
    server_name haryx.wecoap.com;

    # aaPanel renews the Let's Encrypt certificate over HTTP-01.
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/haryx.wecoap.com;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `http2 on;` needs nginx 1.25.1+; this form works on older aaPanel builds too.
    listen 443 ssl http2;
    server_name haryx.wecoap.com;

    ssl_certificate     /www/server/panel/vhost/cert/haryx.wecoap.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/haryx.wecoap.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:haryx_ssl:10m;

    include /www/server/panel/vhost/nginx/haryx/haryx-headers.inc;

    location /api/ {
        client_max_body_size 11m;  # profile files are capped at 10 MB by the API
        proxy_pass http://127.0.0.1:18180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /platform {
        return 301 /platform/;
    }

    # Files live in /www/wwwroot/haryx.wecoap.com/platform/. The browser holds the sync key here,
    # so the page may load nothing but its own files and talk to nothing but this origin and SSO.
    location /platform/ {
        root /www/wwwroot/haryx.wecoap.com;
        try_files $uri $uri/ /platform/index.html;
        include /www/server/panel/vhost/nginx/haryx/haryx-headers.inc;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; worker-src 'self'; connect-src 'self' https://sso.wecoap.com; frame-src https://sso.wecoap.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://sso.wecoap.com; object-src 'none'" always;
        add_header Cache-Control "no-cache" always;

        # Vite's hashed build output never changes under the same name.
        location /platform/assets/ {
            include /www/server/panel/vhost/nginx/haryx/haryx-headers.inc;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }

    location / {
        proxy_pass https://conghai20.github.io/haryx/;
        proxy_set_header Host conghai20.github.io;
        proxy_ssl_server_name on;
        proxy_ssl_name conghai20.github.io;
        proxy_redirect https://conghai20.github.io/haryx/ /;
        # Pages sends its own HSTS; ours (haryx-headers.inc) is the one that counts.
        proxy_hide_header Strict-Transport-Security;
        proxy_cache haryx_pages;
        proxy_cache_valid 200 301 404 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
    }
}
